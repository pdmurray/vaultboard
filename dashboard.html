    // ---- Date formatting helpers ----
    function formatDateHeader(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const dateOnly = new Date(y, m - 1, d);

      if (dateOnly.getTime() === today.getTime()) return 'Today';
      const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
      if (dateOnly.getTime() === yesterday.getTime()) return 'Yesterday';

      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      if (y === now.getFullYear()) {
        return `${days[date.getDay()]}, ${months[date.getMonth()]} ${d}`;
      }
      return `${months[date.getMonth()]} ${d}, ${y}`;
    }

    function formatDateShort(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const now = new Date();
      if (y === now.getFullYear()) return `${months[m-1]} ${d}`;
      return `${months[m-1]} ${d}, ${y}`;
    }

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // ---- Tag helpers ----
    function parseStatusTag(text) {
      // Returns { cleanTitle, status }
      // #waiting → waiting, #someday → someday, none → active
      let status = 'active';
      let cleanTitle = text;
      if (text.match(/#waiting\b/)) {
        status = 'waiting';
        cleanTitle = text.replace(/#waiting\b\s*/g, '').trim();
      } else if (text.match(/#someday\b/)) {
        status = 'someday';
        cleanTitle = text.replace(/#someday\b\s*/g, '').trim();
      }
      return { cleanTitle, status };
    }

    function addStatusTag(text, newStatus) {
      // Remove existing status tags first
      let clean = text.replace(/#waiting\b\s*/g, '').replace(/#someday\b\s*/g, '').trim();
      if (newStatus === 'waiting') return clean + ' #waiting';
      if (newStatus === 'someday') return clean + ' #someday';
      return clean; // 'active' or 'done' = no tag
    }

    // ---- Daily note parser (with subtask support) ----
    function parseDailyNote(content, dateStr) {
      const resultTasks = [];
      const lines = content.split('\n');
      let currentCategory = null;
      let currentTask = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // Detect section headers that end task area
        if (line.match(/^## /)) {
          if (currentTask) { resultTasks.push(currentTask); currentTask = null; }
          break;
        }

        // Detect category parents
        if (line.match(/^- Personal\s*$/)) {
          if (currentTask) { resultTasks.push(currentTask); currentTask = null; }
          currentCategory = 'Personal';
          continue;
        }
        if (line.match(/^- Work\s*$/)) {
          if (currentTask) { resultTasks.push(currentTask); currentTask = null; }
          currentCategory = 'Work';
          continue;
        }

        // Detect tasks (single-tab-indented checkboxes under a category)
        if (currentCategory && line.match(/^\t- \[[ xX]\]/)) {
          // Save previous task
          if (currentTask) { resultTasks.push(currentTask); }

          const checked = line.match(/\[[xX]\]/) !== null;
          const rawText = line.replace(/^\t- \[[ xX]\]\s*/, '').trim();
          if (!rawText) { currentTask = null; continue; } // skip empty

          const { cleanTitle, status } = parseStatusTag(rawText);

          currentTask = {
            id: Date.now() + Math.random(),
            title: cleanTitle,
            rawTitle: rawText,
            note: '',
            checked,
            category: currentCategory,
            dateStr: dateStr,
            status: checked ? 'done' : status,
            subtasks: [],
            lineIndex: i
          };
          continue;
        }

        // Detect subtasks (double-tab-indented checkboxes under a task)
        if (currentTask && line.match(/^\t\t- \[[ xX]\]/)) {
          const checked = line.match(/\[[xX]\]/) !== null;
          const text = line.replace(/^\t\t- \[[ xX]\]\s*/, '').trim();
          if (!text) continue;
          currentTask.subtasks.push({ text, checked });
          continue;
        }
      }

      // Don't forget the last task
      if (currentTask) { resultTasks.push(currentTask); }

      return resultTasks;
    }

    // ---- Regenerate a daily note with updated tasks ----
    function generateDailyNote(dateStr) {
      const fileData = dailyFiles[dateStr];
      if (!fileData) return null;

      const original = fileData.content;
      const lines = original.split('\n');

      // Find the task section boundaries
      let personalStart = -1;
      let workStart = -1;
      let sectionEnd = -1;

      for (let i = 0; i < lines.length; i++) {
        if (lines[i].match(/^- Personal\s*$/)) personalStart = i;
        if (lines[i].match(/^- Work\s*$/)) workStart = i;
        if (lines[i].match(/^## /) && personalStart >= 0) { sectionEnd = i; break; }
      }

      if (personalStart === -1) return original;
      if (sectionEnd === -1) sectionEnd = lines.length;

      // Get tasks for this date
      const tasksForDate = allTasks.filter(t => t.dateStr === dateStr);
      const personalTasks = tasksForDate.filter(t => t.category === 'Personal');
      const workTasks = tasksForDate.filter(t => t.category === 'Work');

      const newTaskLines = [];
      newTaskLines.push('- Personal');
      if (personalTasks.length === 0) {
        newTaskLines.push('\t- [ ] ');
      } else {
        for (const t of personalTasks) {
          const cb = t.checked ? '[x]' : '[ ]';
          const taggedTitle = addStatusTag(t.title, t.checked ? 'done' : t.status);
          newTaskLines.push(`\t- ${cb} ${taggedTitle}`);
          for (const st of t.subtasks) {
            const stCb = st.checked ? '[x]' : '[ ]';
            newTaskLines.push(`\t\t- ${stCb} ${st.text}`);
          }
        }
      }
      newTaskLines.push('- Work');
      if (workTasks.length === 0) {
        newTaskLines.push('\t- [ ] ');
      } else {
        for (const t of workTasks) {
          const cb = t.checked ? '[x]' : '[ ]';
          const taggedTitle = addStatusTag(t.title, t.checked ? 'done' : t.status);
          newTaskLines.push(`\t- ${cb} ${taggedTitle}`);
          for (const st of t.subtasks) {
            const stCb = st.checked ? '[x]' : '[ ]';
            newTaskLines.push(`\t\t- ${stCb} ${st.text}`);
          }
        }
      }

      const before = lines.slice(0, personalStart);
      const after = lines.slice(sectionEnd);
      return [...before, ...newTaskLines, '', ...after].join('\n');
    }

    // ---- Load all daily notes from vault ----
    async function loadVaultTasks() {
      try {
        const dates = await VaultIO.listDailyFiles();
        dailyFiles = {};
        allTasks = [];

        for (const dateStr of dates) {
          const fileData = await VaultIO.readDailyFile(dateStr);
          if (!fileData) continue;

          dailyFiles[dateStr] = {
            content: fileData.content,
            lastModified: fileData.lastModified
          };

          const tasks = parseDailyNote(fileData.content, dateStr);
          allTasks.push(...tasks);
        }

        rebuildViews();
      } catch (e) {
        showStatus('Error loading vault: ' + e.message);
      }
    }

    function rebuildViews() {
      // Build kanban grouping (for board view)
      kanbanTasks = { active: [], waiting: [], someday: [], done: [] };
      for (const t of allTasks) {
        if (t.title.trim()) {
          kanbanTasks[t.status] = kanbanTasks[t.status] || [];
          kanbanTasks[t.status].push(t);
        }
      }
      // Sort: active/waiting/someday by date desc, done by date desc
      for (const key of Object.keys(kanbanTasks)) {
        kanbanTasks[key].sort((a, b) => b.dateStr.localeCompare(a.dateStr));
      }
      // Limit done to last 30 items
      kanbanTasks.done = kanbanTasks.done.slice(0, 30);

      // Build date grouping (for list view) - open tasks only
      dateSections = [];
      dateTasks = {};
      const dateMap = {};
      for (const t of allTasks) {
        if (t.checked || !t.title.trim()) continue;
        if (!dateMap[t.dateStr]) {
          dateMap[t.dateStr] = [];
        }
        dateMap[t.dateStr].push(t);
      }
      const sortedDates = Object.keys(dateMap).sort((a, b) => b.localeCompare(a));
      for (const d of sortedDates) {
        dateSections.push({ id: d, name: d });
        dateTasks[d] = dateMap[d];
      }
    }

    // ---- Card creation ----
    function createCard(task, showDate = false) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.draggable = true;
      card.dataset.id = task.id;

      const categoryClass = task.category === 'Work' ? 'work' : 'personal';

      let metaHtml = `<span class="task-category ${categoryClass}">${task.category}</span>`;
      if (showDate) {
        metaHtml += `<span class="task-date-badge">${formatDateShort(task.dateStr)}</span>`;
      }

      let html = `
        <div style="display: flex; align-items: flex-start; gap: 12px;">
          <button class="delete-btn" data-action="delete" title="Delete task">&times;</button>
          <span class="checkbox ${task.checked ? 'checked' : ''}" data-action="toggle"></span>
          <div style="flex: 1; min-width: 0;">
            <div class="card-title ${task.checked ? 'checked' : ''}" data-action="edit-title">${task.title}</div>
          </div>
          <div style="display: flex; gap: 4px; align-items: center; flex-shrink: 0;">
            ${metaHtml}
          </div>
        </div>
      `;

      if (task.subtasks.length > 0) {
        html += '<div class="card-subtasks" style="margin-left: 30px;">';
        task.subtasks.forEach((st, idx) => {
          html += `<div class="subtask">
            <span class="checkbox ${st.checked ? 'checked' : ''}" data-action="toggle-sub" data-idx="${idx}" style="width: 16px; height: 16px; min-width: 16px; min-height: 16px;"></span>
            <span data-action="edit-subtask" data-idx="${idx}" style="cursor: pointer; ${st.checked ? 'text-decoration: line-through; color: var(--text-muted);' : ''}">${st.text}</span>
          </div>`;
        });
        html += `<div class="subtask add-on-hover" data-action="add-subtask" style="color: var(--text-muted); cursor: pointer; font-style: italic; padding-left: 24px;">+ Add subtask</div>`;
        html += '</div>';
      } else {
        html += `<div class="card-subtasks add-on-hover" style="margin-left: 30px;">
          <div class="subtask" data-action="add-subtask" style="color: var(--text-muted); cursor: pointer; font-style: italic;">+ Add subtask</div>
        </div>`;
      }

      card.innerHTML = html;

      card.addEventListener('dragstart', (e) => {
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', String(task.id));
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
      });

      card.addEventListener('click', (e) => {
        const action = e.target.dataset.action;
        if (action === 'toggle') {
          task.checked = !task.checked;
          task.status = task.checked ? 'done' : 'active';
          markChanged(task.dateStr);
          rebuildViews();
          renderTasks();
        } else if (action === 'toggle-sub') {
          const idx = parseInt(e.target.dataset.idx);
          task.subtasks[idx].checked = !task.subtasks[idx].checked;
          markChanged(task.dateStr);
          renderTasks();
        } else if (action === 'edit-title') {
          startEditingTitle(e.target, task);
        } else if (action === 'edit-subtask') {
          const idx = parseInt(e.target.dataset.idx);
          startEditingSubtask(e.target, task, idx);
        } else if (action === 'add-subtask') {
          startAddingSubtask(e.target, task);
        } else if (action === 'delete') {
          deleteTask(task);
        }
      });

      return card;
    }

    // ---- Inline editing ----
    function startEditingTitle(titleEl, task) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = task.title;
      input.style.cssText = 'width: 100%; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 6px; padding: 6px 10px; color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none;';

      titleEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const newTitle = input.value.trim();
        if (newTitle && newTitle !== task.title) {
          task.title = newTitle;
          markChanged(task.dateStr);
        }
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function startEditingSubtask(subtaskEl, task, idx) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = task.subtasks[idx].text;
      input.style.cssText = 'width: calc(100% - 30px); background: var(--bg-card); border: 2px solid var(--accent); border-radius: 4px; padding: 2px 6px; color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none;';

      subtaskEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const newText = input.value.trim();
        if (newText) { task.subtasks[idx].text = newText; }
        else { task.subtasks.splice(idx, 1); }
        markChanged(task.dateStr);
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function startAddingSubtask(el, task) {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'New subtask...';
      input.style.cssText = 'width: calc(100% - 10px); background: var(--bg-card); border: 2px solid var(--accent); border-radius: 4px; padding: 2px 6px; color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none;';

      el.replaceWith(input);
      input.focus();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const text = input.value.trim();
        if (text) { task.subtasks.push({ text, checked: false }); markChanged(task.dateStr); }
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    // ---- Kanban column creation (board view) ----
    function createKanbanColumn(colDef, items) {
      const col = document.createElement('div');
      col.className = 'column';
      col.innerHTML = `
        <div class="column-header">
          <span class="column-title">${colDef.name}</span>
          <span class="count">${items.length}</span>
        </div>
        <div class="cards" data-column="${colDef.id}"></div>
        ${colDef.id !== 'done' ? `<div class="add-card"><button data-add="${colDef.id}">+ Add task</button></div>` : ''}
      `;

      const cardsContainer = col.querySelector('.cards');
      items.forEach(task => { cardsContainer.appendChild(createCard(task, true)); });

      // Drag-and-drop
      const getDropPosition = (e) => {
        const allCards = [...cardsContainer.querySelectorAll('.task-card')];
        const visibleCards = allCards.filter(c => !c.classList.contains('dragging'));
        let insertBeforeCard = null;
        let dropIndex = visibleCards.length;
        for (let i = 0; i < visibleCards.length; i++) {
          const rect = visibleCards[i].getBoundingClientRect();
          if (e.clientY < rect.top + rect.height / 2) {
            insertBeforeCard = visibleCards[i];
            dropIndex = i;
            break;
          }
        }
        return { insertBeforeCard, dropIndex };
      };

      const showDropIndicator = (e) => {
        col.querySelectorAll('.drop-indicator').forEach(el => el.remove());
        const { insertBeforeCard } = getDropPosition(e);
        const indicator = document.createElement('div');
        indicator.className = 'drop-indicator';
        indicator.style.cssText = 'height: 3px; background: var(--accent); border-radius: 2px; margin: 5px 0;';
        if (insertBeforeCard) { cardsContainer.insertBefore(indicator, insertBeforeCard); }
        else { cardsContainer.appendChild(indicator); }
      };

      col.addEventListener('dragover', (e) => {
        e.preventDefault();
        cardsContainer.classList.add('drag-over');
        showDropIndicator(e);
      });

      col.addEventListener('dragleave', (e) => {
        if (!col.contains(e.relatedTarget)) {
          cardsContainer.classList.remove('drag-over');
          col.querySelectorAll('.drop-indicator').forEach(el => el.remove());
        }
      });

      col.addEventListener('drop', (e) => {
        e.preventDefault();
        cardsContainer.classList.remove('drag-over');
        col.querySelectorAll('.drop-indicator').forEach(el => el.remove());
        const taskId = parseFloat(e.dataTransfer.getData('text/plain'));
        moveTaskToColumn(taskId, colDef.id);
      });

      const addBtn = col.querySelector(`[data-add="${colDef.id}"]`);
      if (addBtn) {
        addBtn.addEventListener('click', () => {
          addNewTask(colDef.id, col.querySelector('.cards'));
        });
      }

      return col;
    }

    // ---- Add new task ----
    function addNewTask(targetStatus, container) {
      const existing = container.querySelector('.new-task-input');
      if (existing) return;

      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'display: flex; gap: 8px; align-items: flex-start;';

      const input = document.createElement('textarea');
      input.className = 'new-task-input';
      input.placeholder = 'What needs to be done?';
      input.rows = 2;
      input.style.flex = '1';

      const catBtn = document.createElement('button');
      catBtn.textContent = 'Personal';
      catBtn.style.cssText = 'font-size: 11px; padding: 6px 10px; white-space: nowrap; margin-top: 2px;';
      let category = 'Personal';
      catBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        category = category === 'Personal' ? 'Work' : 'Personal';
        catBtn.textContent = category;
      });

      wrapper.appendChild(input);
      wrapper.appendChild(catBtn);
      container.appendChild(wrapper);
      input.focus();

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const title = input.value.trim();
          if (title) {
            const today = getTodayStr();
            ensureDailyFile(today);
            const newTask = {
              id: Date.now() + Math.random(),
              title,
              rawTitle: title,
              note: '',
              checked: targetStatus === 'done',
              category: category,
              dateStr: today,
              status: targetStatus,
              subtasks: [],
              lineIndex: -1
            };
            allTasks.push(newTask);
            markChanged(today);
            rebuildViews();
            renderTasks();
          } else { wrapper.remove(); }
        } else if (e.key === 'Escape') { wrapper.remove(); }
      });

      input.addEventListener('blur', (e) => {
        // Don't remove if user clicked the category toggle button
        if (e.relatedTarget === catBtn) return;
        setTimeout(() => wrapper.remove(), 150);
      });
      // Re-focus the input after toggling category so it doesn't dismiss
      catBtn.addEventListener('mousedown', (e) => e.preventDefault());
    }

    function ensureDailyFile(dateStr) {
      if (!dailyFiles[dateStr]) {
        dailyFiles[dateStr] = {
          handle: null,
          content: DAILY_TEMPLATE,
          lastModified: 0
        };
      }
    }

    // ---- Move task between kanban columns ----
    function moveTaskToColumn(taskId, newStatus) {
      const task = allTasks.find(t => t.id === taskId);
      if (!task) return;
      if (task.status === newStatus) return;

      const oldStatus = task.status;
      task.status = newStatus;
      task.checked = (newStatus === 'done');

      markChanged(task.dateStr);
      rebuildViews();
      renderTasks();
      showStatus(`Moved to ${KANBAN_COLUMNS.find(c => c.id === newStatus)?.name || newStatus}`);
    }

    // ---- Delete task ----
    function deleteTask(task) {
      if (!confirm(`Delete "${task.title}"?`)) return;
      const idx = allTasks.findIndex(t => t.id === task.id);
      if (idx !== -1) allTasks.splice(idx, 1);
      markChanged(task.dateStr);
      rebuildViews();
      renderTasks();
    }

    // ---- Auto-save ----
    let saveTimeout = null;
    let watchInterval = null;
    let isSaving = false;
    let dirtyDates = new Set();

    function markChanged(dateStr) {
      hasChanges = true;
      if (dateStr) dirtyDates.add(dateStr);
      saveBtn.disabled = false;
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(autoSave, 800);
    }

    async function autoSave() {
      if (!VaultIO.connected || !hasChanges || isSaving || dirtyDates.size === 0) return;
      isSaving = true;

      try {
        for (const dateStr of dirtyDates) {
          const newContent = generateDailyNote(dateStr);
          if (!newContent) continue;

          const newMtime = await VaultIO.writeDailyFile(dateStr, newContent);
          dailyFiles[dateStr].content = newContent;
          dailyFiles[dateStr].lastModified = newMtime;
        }

        dirtyDates.clear();
        hasChanges = false;
        saveBtn.disabled = true;
        showStatus('Saved');
      } catch (e) {
        showStatus('Save failed: ' + e.message);
      }
      isSaving = false;
    }

    async function checkForExternalChanges() {
      if (!VaultIO.connected || hasChanges || isSaving) return;
      try {
        let changed = false;

        // Check existing files for modifications
        for (const [dateStr, fileData] of Object.entries(dailyFiles)) {
          try {
            const fresh = await VaultIO.readDailyFile(dateStr);
            if (fresh && fresh.lastModified > fileData.lastModified) {
              fileData.content = fresh.content;
              fileData.lastModified = fresh.lastModified;
              changed = true;
            }
          } catch (e) { /* file may have been deleted */ }
        }

        // Check for new daily files
        const allDates = await VaultIO.listDailyFiles();
        for (const dateStr of allDates) {
          if (!dailyFiles[dateStr]) {
            const fresh = await VaultIO.readDailyFile(dateStr);
            if (fresh) {
              dailyFiles[dateStr] = { content: fresh.content, lastModified: fresh.lastModified };
              changed = true;
            }
          }
        }

        if (changed) {
          allTasks = [];
          for (const [dateStr, fileData] of Object.entries(dailyFiles)) {
            const tasks = parseDailyNote(fileData.content, dateStr);
            allTasks.push(...tasks);
          }
          rebuildViews();
          renderTasks();
          showStatus('Reloaded');
        }
      } catch (e) { console.log('Watch error:', e); }
    }

    function startWatching() {
      if (watchInterval) clearInterval(watchInterval);
      watchInterval = setInterval(checkForExternalChanges, 2000);
    }

    function stopWatching() {
      if (watchInterval) { clearInterval(watchInterval); watchInterval = null; }
    }

    // ---- Render ----
    function renderTasks() {
      if (currentView === 'board') { renderBoard(); }
      else { renderList(); }
    }

    function renderBoard() {
      board.innerHTML = '';
      KANBAN_COLUMNS.forEach(colDef => {
        const items = kanbanTasks[colDef.id] || [];
        board.appendChild(createKanbanColumn(colDef, items));
      });
    }

    function renderList() {
      listView.innerHTML = '';

      const today = getTodayStr();
      if (!quickAddSection) quickAddSection = today;

      // Quick add at top
      const quickAdd = document.createElement('div');
      quickAdd.className = 'quick-add';
      quickAdd.style.cssText = 'border-bottom: 2px solid var(--border); margin-bottom: 24px; padding-bottom: 16px;';

      let quickCategory = 'Personal';
      const sectionLabel = dateSections.find(s => s.id === quickAddSection)
        ? formatDateHeader(quickAddSection) : formatDateHeader(today);

      quickAdd.innerHTML = `
        <span class="checkbox" style="opacity: 0.3;"></span>
        <input type="text" class="quick-add-input" placeholder="Add a task..." id="quickAddInput">
        <span class="task-category personal" id="quickAddCatBtn" style="cursor: pointer;">Personal</span>
        <span class="quick-add-section" id="quickAddSectionBtn">${sectionLabel}</span>
      `;
      listView.appendChild(quickAdd);

      const quickInput = document.getElementById('quickAddInput');
      const catToggle = document.getElementById('quickAddCatBtn');
      const sectionBtn = document.getElementById('quickAddSectionBtn');

      catToggle.addEventListener('click', () => {
        quickCategory = quickCategory === 'Personal' ? 'Work' : 'Personal';
        catToggle.textContent = quickCategory;
        catToggle.className = `task-category ${quickCategory.toLowerCase()}`;
      });

      quickInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && quickInput.value.trim()) {
          const title = quickInput.value.trim();
          const targetDate = quickAddSection || today;
          ensureDailyFile(targetDate);
          const newTask = {
            id: Date.now() + Math.random(),
            title,
            rawTitle: title,
            note: '',
            checked: false,
            subtasks: [],
            category: quickCategory,
            dateStr: targetDate,
            status: 'active',
            lineIndex: -1
          };
          allTasks.push(newTask);
          quickInput.value = '';
          markChanged(targetDate);
          rebuildViews();
          renderTasks();
          setTimeout(() => document.getElementById('quickAddInput')?.focus(), 10);
        }
      });

      sectionBtn.addEventListener('click', (e) => { showSectionPicker(e.target); });

      // Render each date section (open tasks only)
      dateSections.forEach(section => {
        const sectionTaskList = dateTasks[section.id] || [];
        const sectionEl = document.createElement('div');
        sectionEl.className = 'list-section';
        sectionEl.dataset.sectionId = section.id;

        const header = document.createElement('div');
        header.className = 'list-section-header';
        header.innerHTML = `
          <span class="section-title column-date" title="${section.id}">${formatDateHeader(section.id)}</span>
          <span class="count">${sectionTaskList.length}</span>
        `;
        sectionEl.appendChild(header);

        const tasksContainer = document.createElement('div');
        tasksContainer.className = 'list-tasks-container';
        tasksContainer.dataset.sectionId = section.id;

        sectionTaskList.forEach(task => {
          tasksContainer.appendChild(createListItem(task));
        });

        sectionEl.appendChild(tasksContainer);
        listView.appendChild(sectionEl);
      });
    }

    // ---- List item creation ----
    function createListItem(task) {
      const item = document.createElement('div');
      item.className = 'list-item';
      item.draggable = false;
      item.dataset.taskId = task.id;

      const checkbox = document.createElement('span');
      checkbox.className = `checkbox ${task.checked ? 'checked' : ''}`;
      checkbox.addEventListener('click', (e) => {
        e.stopPropagation();
        task.checked = !task.checked;
        task.status = task.checked ? 'done' : 'active';
        markChanged(task.dateStr);
        rebuildViews();
        renderTasks();
      });

      const content = document.createElement('div');
      content.className = 'list-item-content';

      const titleRow = document.createElement('div');
      titleRow.style.cssText = 'display: flex; align-items: center; gap: 8px;';

      const title = document.createElement('div');
      title.className = `list-item-title ${task.checked ? 'checked' : ''}`;
      title.textContent = task.title;
      title.style.flex = '1';
      title.addEventListener('click', (e) => {
        e.stopPropagation();
        startEditingListItem(title, task);
      });

      const catBadge = document.createElement('span');
      catBadge.className = `task-category ${task.category === 'Work' ? 'work' : 'personal'}`;
      catBadge.textContent = task.category;

      if (task.status === 'waiting') {
        const statusBadge = document.createElement('span');
        statusBadge.className = 'task-category';
        statusBadge.style.cssText = 'background: var(--badge-waiting-bg); color: var(--badge-waiting-text);';
        statusBadge.textContent = 'Waiting';
        titleRow.appendChild(title);
        titleRow.appendChild(statusBadge);
        titleRow.appendChild(catBadge);
      } else if (task.status === 'someday') {
        const statusBadge = document.createElement('span');
        statusBadge.className = 'task-category';
        statusBadge.style.cssText = 'background: var(--badge-someday-bg); color: var(--badge-someday-text);';
        statusBadge.textContent = 'Someday';
        titleRow.appendChild(title);
        titleRow.appendChild(statusBadge);
        titleRow.appendChild(catBadge);
      } else {
        titleRow.appendChild(title);
        titleRow.appendChild(catBadge);
      }

      content.appendChild(titleRow);

      // Subtasks
      if (task.subtasks && task.subtasks.length > 0) {
        const subtasksContainer = document.createElement('div');
        subtasksContainer.className = 'list-item-subtasks';

        task.subtasks.forEach((st, idx) => {
          const subtaskEl = document.createElement('div');
          subtaskEl.className = 'list-item-subtask';

          const stCheckbox = document.createElement('span');
          stCheckbox.className = `checkbox ${st.checked ? 'checked' : ''}`;
          stCheckbox.addEventListener('click', (e) => {
            e.stopPropagation();
            st.checked = !st.checked;
            markChanged(task.dateStr);
            renderTasks();
          });

          const stText = document.createElement('span');
          stText.textContent = st.text;
          if (st.checked) {
            stText.style.textDecoration = 'line-through';
            stText.style.color = 'var(--text-muted)';
          }
          stText.addEventListener('click', (e) => {
            e.stopPropagation();
            startEditingSubtask(stText, task, idx);
          });

          subtaskEl.appendChild(stCheckbox);
          subtaskEl.appendChild(stText);
          subtasksContainer.appendChild(subtaskEl);
        });

        content.appendChild(subtasksContainer);
      }

      const addSubtask = document.createElement('div');
      addSubtask.className = 'list-item-add-subtask';
      addSubtask.textContent = '+ Add subtask';
      addSubtask.addEventListener('click', (e) => {
        e.stopPropagation();
        startAddingSubtask(addSubtask, task);
      });
      content.appendChild(addSubtask);

      const actions = document.createElement('div');
      actions.className = 'list-item-actions';
      actions.innerHTML = '<button title="Delete task">&times;</button>';
      actions.querySelector('button').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTask(task);
      });

      item.appendChild(checkbox);
      item.appendChild(content);
      item.appendChild(actions);

      return item;
    }

    // ---- List view inline editing ----
    function startEditingListItem(titleEl, task) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = task.title;
      input.style.cssText = 'width: 100%; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 6px; padding: 8px 12px; color: var(--text-primary); font-size: 15px; font-family: inherit; outline: none;';

      titleEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const newTitle = input.value.trim();
        if (newTitle && newTitle !== task.title) {
          task.title = newTitle;
          markChanged(task.dateStr);
        }
        renderTasks();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
        else if (e.key === 'Escape') { saved = true; renderTasks(); }
      });
      input.addEventListener('blur', saveEdit);
    }

    function showSectionPicker(anchorEl) {
      document.querySelectorAll('.section-picker').forEach(el => el.remove());
      const picker = document.createElement('div');
      picker.className = 'section-picker';
      const rect = anchorEl.getBoundingClientRect();
      picker.style.top = (rect.bottom + 4) + 'px';
      picker.style.right = (window.innerWidth - rect.right) + 'px';

      const today = getTodayStr();
      const todayBtn = document.createElement('button');
      todayBtn.textContent = 'Today';
      todayBtn.addEventListener('click', () => {
        quickAddSection = today;
        picker.remove();
        renderTasks();
        setTimeout(() => document.getElementById('quickAddInput')?.focus(), 10);
      });
      picker.appendChild(todayBtn);

      dateSections.forEach(section => {
        if (section.id === today) return;
        const btn = document.createElement('button');
        btn.textContent = formatDateHeader(section.id);
        btn.addEventListener('click', () => {
          quickAddSection = section.id;
          picker.remove();
          renderTasks();
          setTimeout(() => document.getElementById('quickAddInput')?.focus(), 10);
        });
        picker.appendChild(btn);
      });

      document.body.appendChild(picker);
      setTimeout(() => {
        document.addEventListener('click', function closeHandler(e) {
          if (!picker.contains(e.target)) {
            picker.remove();
            document.removeEventListener('click', closeHandler);
          }
        });
      }, 10);
    }

    // ---- View switching ----

        // ============================================================
    // ===== JOURNAL FUNCTIONALITY =====
    // ============================================================

    const journalEmptyState = document.getElementById('journalEmptyState');
    const journalMainContent = document.getElementById('journalMainContent');
    const journalEntries = document.getElementById('journalEntries');
    const journalNewEntry = document.getElementById('journalNewEntry');
    const journalSaveBtn = document.getElementById('journalSaveBtn');
    const journalComposeDate = document.getElementById('journalComposeDate');

    // Render markdown to HTML (uses marked.js if available, falls back to plain text)
    function renderMarkdown(text) {
      if (typeof marked !== 'undefined') {
        return marked.parse(text, { breaks: true });
      }
      return '<p>' + escapeHtml(text) + '</p>';
    }

    // Format current time as "10:32 AM"
    function formatTimeNow() {
      return new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    // Extract raw ## Journal and ## Observations sections from a daily note
    function extractSectionsFromContent(content) {
      const journalMatch = content.match(/## Journal\n([\s\S]*?)(?=\n## |$)/);
      const observationsMatch = content.match(/## Observations\n([\s\S]*?)(?=\n## |$)/);
      const journal = journalMatch ? journalMatch[1].trim() : '';
      const observations = observationsMatch ? observationsMatch[1].trim() : '';
      return { journal, observations };
    }

    // Parse a journal section into individual timestamped entries.
    // Format: **10:32 AM** — text...\n\n**2:15 PM** — more text...
    // Backward compat: if no timestamps found, treat entire block as a single legacy entry.
    const TIMESTAMP_RE = /^\*\*(\d{1,2}:\d{2}\s*[AP]M)\*\*\s*[—–-]\s*/im;
    const TIMESTAMP_SPLIT_RE = /(?=^\*\*\d{1,2}:\d{2}\s*[AP]M\*\*\s*[—–-]\s*)/im;

    function parseJournalEntries(journalText) {
      if (!journalText) return [];

      // Check if the text has any timestamps
      if (!TIMESTAMP_RE.test(journalText)) {
        // Legacy format — single block, no timestamps
        return [{ time: null, text: journalText, legacy: true }];
      }

      // Split on timestamp boundaries
      const blocks = journalText.split(TIMESTAMP_SPLIT_RE).filter(b => b.trim());
      return blocks.map(block => {
        const match = block.match(TIMESTAMP_RE);
        if (match) {
          const time = match[1].trim();
          const text = block.slice(match[0].length).trim();
          return { time, text, legacy: false };
        }
        // Shouldn't happen, but treat as legacy
        return { time: null, text: block.trim(), legacy: true };
      });
    }

    // Rebuild the journal section text from parsed entries
    function serializeJournalEntries(entries) {
      return entries.map(e => {
        if (e.legacy || !e.time) return e.text;
        return `**${e.time}** — ${e.text}`;
      }).join('\n\n');
    }

    // Build sorted list of daily journal data from loaded daily files
    function getJournalDays() {
      const days = [];
      for (const [dateStr, fileData] of Object.entries(dailyFiles)) {
        const { journal, observations } = extractSectionsFromContent(fileData.content);
        if (journal || observations) {
          const entries = parseJournalEntries(journal);
          days.push({ dateStr, entries, observations });
        }
      }
      days.sort((a, b) => b.dateStr.localeCompare(a.dateStr));
      return days;
    }

    function formatDateDisplay(dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return d.toLocaleDateString('en-US', options);
    }

    // Write the journal section back to a daily file
    async function writeJournalSection(dateStr, newJournalText) {
      const content = dailyFiles[dateStr].content;
      const lines = content.split('\n');
      let journalStart = -1;
      let journalEnd = -1;

      for (let i = 0; i < lines.length; i++) {
        if (lines[i].match(/^## Journal\s*$/)) {
          journalStart = i + 1;
        } else if (journalStart >= 0 && journalEnd === -1 && lines[i].match(/^## /)) {
          journalEnd = i;
        }
      }

      if (journalStart === -1) {
        let insertAt = lines.length;
        for (let i = 0; i < lines.length; i++) {
          if (lines[i].match(/^## Observations\s*$/)) { insertAt = i; break; }
        }
        lines.splice(insertAt, 0, '## Journal', '', newJournalText, '');
      } else {
        if (journalEnd === -1) journalEnd = lines.length;
        const before = lines.slice(0, journalStart);
        const after = lines.slice(journalEnd);
        lines.length = 0;
        lines.push(...before, '', newJournalText, '', ...after);
      }

      const newContent = lines.join('\n');
      const mtime = await VaultIO.writeDailyFile(dateStr, newContent);
      dailyFiles[dateStr].content = newContent;
      dailyFiles[dateStr].lastModified = mtime || Date.now();
    }

    // Render the journal tab
    function renderJournal() {
      if (!VaultIO.connected) {
        journalEmptyState.style.display = '';
        journalMainContent.style.display = 'none';
        return;
      }

      journalEmptyState.style.display = 'none';
      journalMainContent.style.display = 'flex';

      // Compose area: always empty, always for new entries
      const today = getTodayStr();
      journalComposeDate.textContent = formatDateDisplay(today);
      journalNewEntry.value = '';

      const days = getJournalDays();

      if (days.length === 0) {
        journalEntries.innerHTML = '<div class="empty-state"><p style="color: var(--text-muted); font-size: 15px;">No journal entries yet. Write something above to get started.</p></div>';
        return;
      }

      let html = '';
      for (const day of days) {
        html += `<div class="journal-entry" data-date="${escapeHtml(day.dateStr)}">`;
        html += `<div class="journal-entry-header">`;
        html += `<div class="journal-entry-date">${formatDateDisplay(day.dateStr)}</div>`;
        html += `</div>`;

        // Render each sub-entry (timestamped or legacy)
        if (day.entries.length > 0) {
          for (let i = 0; i < day.entries.length; i++) {
            const entry = day.entries[i];
            html += `<div class="journal-sub-entry${entry.legacy ? ' legacy' : ''}" data-entry-index="${i}">`;
            if (entry.time) {
              html += `<div class="journal-entry-header">`;
              html += `<div class="journal-entry-time">${escapeHtml(entry.time)}</div>`;
              html += `<div class="journal-entry-actions">`;
              html += `<button class="journal-entry-action-btn journal-edit-btn" data-date="${escapeHtml(day.dateStr)}" data-index="${i}" title="Edit entry">✎</button>`;
              html += `</div>`;
              html += `</div>`;
            } else {
              // Legacy entry — float edit button over top-right of body
              html += `<div class="journal-entry-actions legacy-actions">`;
              html += `<button class="journal-entry-action-btn journal-edit-btn" data-date="${escapeHtml(day.dateStr)}" data-index="${i}" title="Edit entry">✎</button>`;
              html += `</div>`;
            }
            html += `<div class="journal-entry-body">${renderMarkdown(entry.text)}</div>`;
            html += `</div>`;
          }
        }

        if (day.observations) {
          html += `<div class="journal-entry-observations">`;
          html += `<div class="journal-entry-observations-label">Observations</div>`;
          html += `<div class="journal-entry-body">${renderMarkdown(day.observations)}</div>`;
          html += `</div>`;
        }

        html += `</div>`;
      }
      journalEntries.innerHTML = html;

      // Attach inline edit handlers
      journalEntries.querySelectorAll('.journal-edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const dateStr = btn.dataset.date;
          const index = parseInt(btn.dataset.index, 10);
          startInlineEdit(dateStr, index);
        });
      });
    }

    // Inline edit: replace rendered entry with a textarea
    function startInlineEdit(dateStr, entryIndex) {
      const { journal } = extractSectionsFromContent(dailyFiles[dateStr].content);
      const entries = parseJournalEntries(journal);
      const entry = entries[entryIndex];
      if (!entry) return;

      // Find the right sub-entry within the correct date card
      const card = journalEntries.querySelector(`.journal-entry[data-date="${dateStr}"]`);
      if (!card) return;
      const target = card.querySelector(`.journal-sub-entry[data-entry-index="${entryIndex}"]`);
      if (!target) return;

      // Replace body with textarea
      const bodyEl = target.querySelector('.journal-entry-body');
      const actionsEl = target.querySelector('.journal-entry-actions');
      if (!bodyEl) return;

      // Hide actions while editing
      if (actionsEl) actionsEl.style.display = 'none';

      const originalHtml = bodyEl.innerHTML;
      const textarea = document.createElement('textarea');
      textarea.className = 'journal-entry-edit-area';
      textarea.value = entry.text;
      textarea.rows = Math.max(3, entry.text.split('\n').length + 1);

      const footer = document.createElement('div');
      footer.className = 'journal-entry-edit-footer';
      footer.innerHTML = `<button class="cancel-edit">Cancel</button><button class="primary save-edit">Save</button>`;

      bodyEl.replaceWith(textarea);
      textarea.after(footer);
      textarea.focus();

      footer.querySelector('.cancel-edit').addEventListener('click', () => {
        // Restore original rendered content
        footer.remove();
        const newBody = document.createElement('div');
        newBody.className = 'journal-entry-body';
        newBody.innerHTML = originalHtml;
        textarea.replaceWith(newBody);
        if (actionsEl) actionsEl.style.display = '';
      });

      footer.querySelector('.save-edit').addEventListener('click', async () => {
        const newText = textarea.value.trim();
        if (!newText) return;

        // Update the entry in place
        entries[entryIndex] = { ...entry, text: newText };
        const newJournalText = serializeJournalEntries(entries);
        await writeJournalSection(dateStr, newJournalText);

        showStatus('Entry updated');
        renderJournal();
      });
    }

    // Save: append a new timestamped entry to today's journal
    journalSaveBtn.addEventListener('click', async () => {
      if (!VaultIO.connected) return;
      const newText = journalNewEntry.value.trim();
      if (!newText) return;

      const today = getTodayStr();
      const timestamp = formatTimeNow();
      const newEntry = `**${timestamp}** — ${newText}`;

      if (!dailyFiles[today]) {
        // Create a new daily note
        const template = `# Daily Notes\n\n## Tasks\n- Personal\n\t- [ ] \n- Work\n\t- [ ] \n\n## Journal\n\n${newEntry}\n\n## Observations\n`;
        await VaultIO.writeDailyFile(today, template);
        dailyFiles[today] = { content: template, lastModified: Date.now() };
      } else {
        // Append to existing journal section
        const { journal } = extractSectionsFromContent(dailyFiles[today].content);
        const updatedJournal = journal ? `${journal}\n\n${newEntry}` : newEntry;
        await writeJournalSection(today, updatedJournal);
      }

      showStatus('Journal entry saved');
      renderJournal();
    });

    // ============================================================
    // ===== MEMORY FUNCTIONALITY =====
    // ============================================================

    let memoryData = {
      claudeMd: null,
      memoryFiles: [],
      memoryDirs: {}
    };

    const memoryEmptyState = document.getElementById('memoryEmptyState');
    const memoryMainContent = document.getElementById('memoryMainContent');
    const memoryTabsContainer = document.getElementById('memoryTabsContainer');
    const memoryContentContainer = document.getElementById('memoryContentContainer');
    const modalOverlay = document.getElementById('modalOverlay');

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function parseMemoryMarkdown(content) {
      const parsed = {
        title: '',
        fields: {},
        sections: {},
        tables: [],
        rawContent: content
      };

      const lines = content.split('\n');
      let currentSection = '_intro';
      parsed.sections[currentSection] = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (line.match(/^# /)) {
          parsed.title = line.replace(/^# /, '').trim();
          continue;
        }

        if (line.match(/^## /)) {
          currentSection = line.replace(/^## /, '').trim();
          parsed.sections[currentSection] = [];
          continue;
        }

        const kvMatch = line.match(/^\*\*(.+?):\*\*\s*(.*)$/);
        if (kvMatch) {
          parsed.fields[kvMatch[1]] = kvMatch[2];
          continue;
        }

        parsed.sections[currentSection].push(line);
      }

      for (const key in parsed.sections) {
        parsed.sections[key] = parsed.sections[key].join('\n').trim();
      }

      const tableRegex = /\|(.+)\|\n\|[-| ]+\|\n((?:\|.+\|\n?)+)/g;
      let match;
      while ((match = tableRegex.exec(content)) !== null) {
        const headers = match[1].split('|').map(h => h.trim()).filter(h => h);
        const rowLines = match[2].trim().split('\n');
        const rows = rowLines.map(row => row.split('|').map(c => c.trim()).filter(c => c));
        parsed.tables.push({ headers, rows });
      }

      return parsed;
    }

    function getPreview(content, maxLength = 150) {
      let preview = content
        .replace(/^#+ .+$/gm, '')
        .replace(/\*\*(.+?):\*\*.*/g, '')
        .replace(/\|.+\|/g, '')
        .replace(/[-=]{3,}/g, '')
        .trim()
        .substring(0, maxLength);
      if (content.length > maxLength) preview += '...';
      return preview;
    }

    function getDisplayName(filename) {
      return filename
        .replace('.md', '')
        .split(/[-_]/)
        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    async function loadMemoryFromVaultIO() {
      memoryData = { claudeMd: null, memoryFiles: [], memoryDirs: {} };

      try {
        const claudeContent = await VaultIO.readClaudeMd();
        if (claudeContent) {
          memoryData.claudeMd = { content: claudeContent };
        }
      } catch (e) { console.log('No CLAUDE.md found'); }

      try {
        const tree = await VaultIO.listMemoryTree();

        for (const fileName of tree.files) {
          const content = await VaultIO.readMemoryFile(fileName);
          if (content) {
            memoryData.memoryFiles.push({ name: fileName, content, relPath: fileName });
          }
        }

        for (const [dirName, files] of Object.entries(tree.dirs)) {
          memoryData.memoryDirs[dirName] = [];
          for (const fileName of files) {
            const relPath = dirName + '/' + fileName;
            const content = await VaultIO.readMemoryFile(relPath);
            if (content) {
              memoryData.memoryDirs[dirName].push({
                name: fileName,
                content: content,
                relPath: relPath,
                parsed: parseMemoryMarkdown(content)
              });
            }
          }
        }
      } catch (e) { console.log('No memory/ directory found'); }

      const hasContent = memoryData.claudeMd || memoryData.memoryFiles.length > 0 || Object.keys(memoryData.memoryDirs).length > 0;

      if (hasContent) {
        renderMemory();
        memoryEmptyState.style.display = 'none';
        memoryMainContent.style.display = 'flex';
        showStatus('Loaded memory');
      } else {
        // No memory files yet — show a helpful message
        memoryEmptyState.style.display = '';
        memoryMainContent.style.display = 'none';
        const title = memoryEmptyState.querySelector('#memoryEmptyTitle');
        title.textContent = VaultIO.connected
          ? 'No memory files found in vault'
          : 'Select your vault to load memory';
        const hint = memoryEmptyState.querySelector('.memory-hint');
        if (hint && VaultIO.connected) {
          hint.textContent = 'Add a CLAUDE.md file to the memory/ directory in your vault to get started.';
        }
        showStatus('No memory files found');
      }
      if (activeMainTab === 'memory') {
        filePathEl.textContent = IS_SERVED ? 'vault (server)' : (VaultIO._vaultHandle?.name ? VaultIO._vaultHandle.name + ' / memory' : '');
      }
    }

    function renderMemory() {
      renderMemoryTabs();
      renderMemoryContent();
    }

    function renderMemoryTabs() {
      let html = '';

      if (memoryData.claudeMd) {
        html += `<button class="memory-tab active" data-tab="overview">Overview</button>`;
      }

      for (const file of memoryData.memoryFiles) {
        const name = file.name.replace('.md', '');
        html += `<button class="memory-tab${!memoryData.claudeMd && memoryData.memoryFiles[0] === file ? ' active' : ''}" data-tab="file-${name}">${name}</button>`;
      }

      for (const dirName of Object.keys(memoryData.memoryDirs).sort()) {
        const files = memoryData.memoryDirs[dirName];
        let count;
        if (dirName === 'context') {
          count = 0;
          for (const file of files) {
            const p = file.parsed;
            count += Object.keys(p.fields).length;
            for (const table of p.tables) {
              count += table.rows.length;
            }
            for (const [sName, sContent] of Object.entries(p.sections)) {
              if (sContent && sName !== '_intro') {
                count += sContent.split('\n').filter(l => l.trim() && !l.trim().startsWith('|')).length;
              }
            }
          }
        } else {
          count = files.length;
        }
        html += `<button class="memory-tab" data-tab="dir-${dirName}">${dirName} <span class="count">${count}</span></button>`;
      }

      memoryTabsContainer.innerHTML = html;

      memoryTabsContainer.querySelectorAll('.memory-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          memoryTabsContainer.querySelectorAll('.memory-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          renderMemoryContent();
        });
      });
    }

    function renderMemoryContent() {
      const activeTab = memoryTabsContainer.querySelector('.memory-tab.active');
      if (!activeTab) return;

      const tabId = activeTab.dataset.tab;

      if (tabId === 'overview') { renderMemoryOverview(); }
      else if (tabId.startsWith('file-')) {
        const fileName = tabId.replace('file-', '') + '.md';
        renderMemoryFile(fileName);
      } else if (tabId.startsWith('dir-')) {
        const dirName = tabId.replace('dir-', '');
        renderMemoryDirectory(dirName);
      }
    }

    function renderMemoryOverview() {
      if (!memoryData.claudeMd) return;

      let statsHtml = '<div class="stats">';
      for (const [dirName, files] of Object.entries(memoryData.memoryDirs)) {
        let count;
        if (dirName === 'context') {
          count = 0;
          for (const file of files) {
            const p = file.parsed;
            count += Object.keys(p.fields).length;
            for (const table of p.tables) { count += table.rows.length; }
            for (const [sName, sContent] of Object.entries(p.sections)) {
              if (sContent && sName !== '_intro') {
                count += sContent.split('\n').filter(l => l.trim() && !l.trim().startsWith('|')).length;
              }
            }
          }
        } else {
          count = files.length;
        }
        statsHtml += `
          <div class="stat">
            <div class="stat-value">${count}</div>
            <div class="stat-label">${dirName}</div>
          </div>
        `;
      }
      statsHtml += '</div>';

      const claudeContent = renderMarkdownToHtml(memoryData.claudeMd.content);

      memoryContentContainer.innerHTML = `
        ${statsHtml}
        <div class="file-card">
          <div class="file-card-header" onclick="this.nextElementSibling.classList.toggle('expanded'); this.querySelector('.toggle').textContent = this.nextElementSibling.classList.contains('expanded') ? '\u2212' : '+'">
            <span class="file-card-title">CLAUDE.md</span>
            <span class="toggle" style="color: var(--text-muted);">&minus;</span>
          </div>
          <div class="file-card-content expanded markdown-content">${claudeContent}</div>
        </div>
        <button onclick="openEditModal('CLAUDE.md', 'claudeMd')" style="margin-top: 10px;">Edit CLAUDE.md</button>
      `;
    }

    function renderMemoryFile(fileName) {
      const file = memoryData.memoryFiles.find(f => f.name === fileName);
      if (!file) return;

      const content = renderMarkdownToHtml(file.content);

      memoryContentContainer.innerHTML = `
        <div class="file-card">
          <div class="file-card-header">
            <span class="file-card-title">${fileName}</span>
          </div>
          <div class="file-card-content expanded markdown-content">${content}</div>
        </div>
        <button onclick="openEditModal('${fileName}', 'memoryFile')" style="margin-top: 10px;">Edit ${fileName}</button>
      `;
    }

    function renderMemoryDirectory(dirName) {
      const files = memoryData.memoryDirs[dirName] || [];

      // Context directory uses flat list view
      if (dirName === 'context') {
        renderMemoryDirectoryFlat(dirName, files);
        return;
      }

      // All other directories use card grid view
      let html = `
        <div class="search-box">
          <span style="color: var(--text-muted);">&#128269;</span>
          <input type="text" placeholder="Search ${dirName}..." id="dirSearch" oninput="filterMemoryDirectory('${dirName}', this.value)">
        </div>
        <div class="memory-grid" id="dirGrid">
      `;

      for (const file of files) {
        const p = file.parsed;
        const title = p.title || getDisplayName(file.name);

        let fieldsHtml = '';
        const fieldEntries = Object.entries(p.fields).slice(0, 3);
        if (fieldEntries.length > 0) {
          fieldsHtml = '<div class="memory-card-fields">';
          for (const [key, value] of fieldEntries) {
            fieldsHtml += `
              <div class="memory-card-field">
                <span class="memory-card-field-label">${escapeHtml(key)}</span>
                <span class="memory-card-field-value">${escapeHtml(value)}</span>
              </div>
            `;
          }
          fieldsHtml += '</div>';
        }

        let preview = '';
        for (const [sectionName, sectionContent] of Object.entries(p.sections)) {
          if (sectionContent && sectionName !== '_intro') {
            preview = getPreview(sectionContent, 100);
            break;
          }
        }
        if (!preview) preview = getPreview(p.rawContent, 100);

        html += `
          <div class="memory-card" onclick="openFileModal('${dirName}', '${file.name}')" data-search="${escapeHtml((title + ' ' + JSON.stringify(p.fields) + ' ' + p.rawContent).toLowerCase())}">
            <div class="memory-card-title">${escapeHtml(title)}</div>
            ${fieldsHtml}
            <div class="memory-card-preview">${escapeHtml(preview)}</div>
          </div>
        `;
      }

      html += `
        <div class="add-btn" onclick="openNewFileModal('${dirName}')">
          + Add to ${dirName}
        </div>
      </div>`;

      memoryContentContainer.innerHTML = html;
    }

    function renderMemoryDirectoryFlat(dirName, files) {
      let html = `
        <div class="search-box">
          <span style="color: var(--text-muted);">&#128269;</span>
          <input type="text" placeholder="Search ${dirName}..." id="dirSearch" oninput="filterMemoryDirectory('${dirName}', this.value)">
        </div>
        <div id="dirGrid">
      `;

      for (const file of files) {
        const p = file.parsed;

        // Render fields as a key-value table
        const fieldEntries = Object.entries(p.fields);
        if (fieldEntries.length > 0) {
          html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><tbody>`;
          for (const [key, value] of fieldEntries) {
            html += `<tr data-search="${escapeHtml((key + ' ' + value).toLowerCase())}"><td>${escapeHtml(key)}</td><td>${escapeHtml(value)}</td></tr>`;
          }
          html += `</tbody></table></div>`;
        }

        // Render parsed tables (teams, tools, etc.) as proper HTML tables
        for (const table of p.tables) {
          html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><thead><tr>`;
          for (const h of table.headers) {
            html += `<th>${escapeHtml(h)}</th>`;
          }
          html += `</tr></thead><tbody>`;
          for (const row of table.rows) {
            const searchData = row.join(' ').toLowerCase();
            html += `<tr data-search="${escapeHtml(searchData)}">`;
            for (const cell of row) {
              html += `<td>${escapeHtml(cell)}</td>`;
            }
            html += `</tr>`;
          }
          html += `</tbody></table></div>`;
        }

        // Render non-table section content as list items
        for (const [sectionName, sectionContent] of Object.entries(p.sections)) {
          if (!sectionContent || sectionName === '_intro') continue;
          const lines = sectionContent.split('\n').filter(l => l.trim() && !l.trim().startsWith('|'));
          if (lines.length === 0) continue;
          html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><thead><tr><th colspan="2">${escapeHtml(sectionName)}</th></tr></thead><tbody>`;
          for (const line of lines) {
            const cleanLine = line.replace(/^[-*]\s*/, '').replace(/\*\*(.+?)\*\*/g, '$1').trim();
            if (!cleanLine) continue;
            html += `<tr data-search="${escapeHtml((sectionName + ' ' + cleanLine).toLowerCase())}"><td colspan="2">${escapeHtml(cleanLine)}</td></tr>`;
          }
          html += `</tbody></table></div>`;
        }
      }

      html += `</div>`;
      memoryContentContainer.innerHTML = html;
    }

    function filterMemoryDirectory(dirName, searchTerm) {
      const grid = document.getElementById('dirGrid');
      const items = grid.querySelectorAll('.memory-card, tr[data-search]');
      const search = searchTerm.toLowerCase();
      items.forEach(item => {
        const searchData = item.dataset.search || '';
        item.style.display = (!search || searchData.includes(search)) ? '' : 'none';
      });
    }

    function renderMarkdownToHtml(md) {
      let html = escapeHtml(md);

      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/```[\s\S]*?```/g, match => {
        const code = match.replace(/```\w*\n?/g, '');
        return '<pre><code>' + code + '</code></pre>';
      });
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/(\|.+\|\n\|[-| ]+\|\n(?:\|.+\|\n?)+)/g, match => {
        const lines = match.trim().split('\n');
        const headers = lines[0].split('|').filter(c => c.trim());
        const rows = lines.slice(2).map(row => row.split('|').filter(c => c.trim()));
        let table = '<table><thead><tr>';
        headers.forEach(h => table += `<th>${h.trim()}</th>`);
        table += '</tr></thead><tbody>';
        rows.forEach(row => {
          table += '<tr>';
          row.forEach(cell => table += `<td>${cell.trim()}</td>`);
          table += '</tr>';
        });
        table += '</tbody></table>';
        return table;
      });
      html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
      html = html.replace(/^(?!<[hupol]|<li|<table|<pre)(.+)$/gm, '<p>$1</p>');
      html = html.replace(/<p><\/p>/g, '');
      html = html.replace(/<p>\s*<\/p>/g, '');

      return html;
    }

    // Modal functions
    function openFileModal(dirName, fileName) {
      const files = memoryData.memoryDirs[dirName];
      const file = files.find(f => f.name === fileName);
      if (!file) return;

      document.getElementById('modalTitle').textContent = getDisplayName(fileName);
      document.getElementById('modalBody').innerHTML = `
        <div class="markdown-content" style="margin-bottom: 20px;">
          ${renderMarkdownToHtml(file.content)}
        </div>
        <div class="form-group">
          <label>Edit Raw Markdown</label>
          <textarea id="editContent">${escapeHtml(file.content)}</textarea>
        </div>
      `;

      modalOverlay.classList.add('visible');
      modalOverlay.dataset.type = 'dirFile';
      modalOverlay.dataset.dirName = dirName;
      modalOverlay.dataset.fileName = fileName;
    }

    function openNewFileModal(dirName) {
      document.getElementById('modalTitle').textContent = `Add to ${dirName}`;

      let template = '# New Entry\n\n';
      const existingFiles = memoryData.memoryDirs[dirName];
      if (existingFiles && existingFiles.length > 0) {
        const sample = existingFiles[0].parsed;
        for (const key of Object.keys(sample.fields)) {
          template += `**${key}:** \n`;
        }
        template += '\n';
        for (const section of Object.keys(sample.sections)) {
          if (section !== '_intro') {
            template += `## ${section}\n\n`;
          }
        }
      }

      document.getElementById('modalBody').innerHTML = `
        <div class="form-group">
          <label>Filename (without .md)</label>
          <input type="text" id="newFileName" placeholder="my-new-entry" style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text-primary); font-size: 14px; font-family: inherit; margin-bottom: 16px;">
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea id="editContent">${escapeHtml(template)}</textarea>
        </div>
      `;

      modalOverlay.classList.add('visible');
      modalOverlay.dataset.type = 'newDirFile';
      modalOverlay.dataset.dirName = dirName;
    }

    function openEditModal(fileName, type) {
      let content = '';
      if (type === 'claudeMd') {
        content = memoryData.claudeMd.content;
      } else if (type === 'memoryFile') {
        const file = memoryData.memoryFiles.find(f => f.name === fileName);
        if (file) content = file.content;
      }

      document.getElementById('modalTitle').textContent = `Edit ${fileName}`;
      document.getElementById('modalBody').innerHTML = `
        <div class="form-group">
          <label>Content</label>
          <textarea id="editContent" style="min-height: 400px;">${escapeHtml(content)}</textarea>
        </div>
      `;

      modalOverlay.classList.add('visible');
      modalOverlay.dataset.type = type;
      modalOverlay.dataset.fileName = fileName;
    }

    function closeModal() {
      modalOverlay.classList.remove('visible');
    }

    async function saveModal() {
      const type = modalOverlay.dataset.type;
      const content = document.getElementById('editContent').value;

      try {
        if (type === 'claudeMd') {
          memoryData.claudeMd.content = content;
          await VaultIO.writeClaudeMd(content);
          showStatus('Saved CLAUDE.md');

        } else if (type === 'memoryFile') {
          const fileName = modalOverlay.dataset.fileName;
          const file = memoryData.memoryFiles.find(f => f.name === fileName);
          if (file) {
            file.content = content;
            await VaultIO.writeMemoryFile(file.relPath || file.name, content);
            showStatus('Saved ' + fileName);
          }

        } else if (type === 'dirFile') {
          const dirName = modalOverlay.dataset.dirName;
          const fileName = modalOverlay.dataset.fileName;
          const files = memoryData.memoryDirs[dirName];
          const file = files.find(f => f.name === fileName);
          if (file) {
            file.content = content;
            file.parsed = parseMemoryMarkdown(content);
            await VaultIO.writeMemoryFile(file.relPath || (dirName + '/' + fileName), content);
            showStatus('Saved ' + fileName);
          }

        } else if (type === 'newDirFile') {
          const dirName = modalOverlay.dataset.dirName;
          let fileName = document.getElementById('newFileName').value.trim();
          if (!fileName) { showStatus('Please enter a filename'); return; }
          if (!fileName.endsWith('.md')) fileName += '.md';

          const relPath = dirName + '/' + fileName;
          await VaultIO.writeMemoryFile(relPath, content);

          memoryData.memoryDirs[dirName].push({
            name: fileName,
            content: content,
            relPath: relPath,
            parsed: parseMemoryMarkdown(content)
          });

          showStatus('Created ' + fileName);
        }

        closeModal();
        renderMemory();

      } catch (e) {
        showStatus('Error saving: ' + e.message);
      }
    }

    // Memory event listeners
    // Memory picker removed — memory loads from vault automatically
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalSave').addEventListener('click', saveModal);

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Expose functions to onclick handlers
    window.openFileModal = openFileModal;
    window.openNewFileModal = openNewFileModal;
    window.openEditModal = openEditModal;
    window.filterMemoryDirectory = filterMemoryDirectory;

    // Auto-restore previous file/folder handles on load
    tryRestoreHandles();

    // In server mode, hide vault picker UI — everything auto-connects
    if (IS_SERVED) {
      openTaskBtn.style.display = 'none';
      // Hide task empty state (vault picker) — show a loading message instead
      const boardEmptyState = document.getElementById('boardEmptyState');
      if (boardEmptyState) {
        boardEmptyState.querySelector('#taskEmptyTitle').textContent = 'Connecting to vault…';
        boardEmptyState.querySelector('#openBtnLarge').style.display = 'none';
        boardEmptyState.querySelector('#reconnectTaskBtn').style.display = 'none';
      }
      // Update memory and journal empty states
      memoryEmptyState.querySelector('#memoryEmptyTitle').textContent = 'Connecting to vault…';
      journalEmptyState.querySelector('#journalEmptyTitle').textContent = 'Connecting to vault…';
    }
  </script>
</body>
</html>
